reset_today:
  name: Reiniciar día
  description: Borra las comidas y el checklist de un día.
  fields:
    date:
      name: Fecha
      description: Fecha ISO opcional; por defecto hoy.
      example: "2026-09-06"
      selector:
        date: {}

generate_shopping:
  name: Generar lista de compra
  description: Genera una lista de compra a partir del menú semanal.

copy_week:
  name: Copiar semana
  description: Copia los registros diarios de la semana anterior a la semana actual.
  fields:
    source_offset:
      name: Desfase de origen
      description: Días hacia atrás desde cada día de la semana actual.
      default: 7
      selector:
        number:
          min: 1
          max: 365
          mode: box

add_shopping_item:
  name: Añadir producto
  description: Añade un producto manual a la lista.
  fields:
    name:
      name: Producto
      required: true
      selector:
        text: {}
    category:
      name: Categoría
      default: extras
      selector:
        select:
          options:
            - value: proteina
              label: Proteína
            - value: carbohidratos
              label: Carbohidratos
            - value: verduras_frutas
              label: Verduras / Frutas
            - value: extras
              label: Extras

complete_checklist:
  name: Completar checklist
  description: Marca los 8 objetivos como completados.
  fields:
    date:
      name: Fecha
      selector:
        date: {}

notify_today:
  name: Notificar resumen de hoy
  description: Envía un resumen del día mediante un servicio notify de Home Assistant.
  fields:
    notify_service:
      name: Servicio de notificación
      description: Por ejemplo notify.mobile_app_telefono.
      selector:
        text: {}
    message:
      name: Mensaje personalizado
      selector:
        text:
          multiline: true
